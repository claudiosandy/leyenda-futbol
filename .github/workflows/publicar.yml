name: Verificar y publicar el juego

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Instalar dependencias (versiones fijadas)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Comprobar que index.html está al día con src/ y no tiene errores
        run: npm run check
      - name: Preparar la web
        run: mkdir _site && cp index.html _site/ && cp -r assets _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

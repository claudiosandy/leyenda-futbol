<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Leyenda: Modo Carrera</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06100b;--panel:rgba(9,20,15,.92);--panel2:rgba(255,255,255,.045);--line:rgba(255,255,255,.12);--text:#eef6f0;--muted:#9db3a5;--accent:#3cf08a;--gold:#f6c945;--red:#ff5d5d;--blue:#58b4ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;inset:0;overflow-y:auto;padding:24px 16px 40px;background:linear-gradient(180deg,rgba(4,10,8,.5),rgba(4,10,8,.9));display:flex}
#ui.split{background:linear-gradient(90deg,rgba(4,10,8,0) 0%,rgba(4,10,8,.15) 38%,rgba(4,10,8,.85) 58%)}
#ui.split .card{margin:auto 0 auto auto;max-width:540px}
@media (max-width:760px){#ui.split{background:linear-gradient(180deg,rgba(4,10,8,0) 0%,rgba(4,10,8,0) 34%,rgba(4,10,8,.92) 46%);padding-top:44vh}#ui.split .card{margin:0 auto auto}}
.hidden{display:none!important}
.card{margin:auto;width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
h1{font-size:clamp(60px,12vw,120px);line-height:.85}
h1 span{color:var(--accent)}
h2{font-size:clamp(30px,5vw,44px);line-height:1;margin-bottom:6px}
h3{font-size:22px;color:var(--muted);margin:20px 0 8px}
p{color:#cfe0d5;line-height:1.5;margin:8px 0}
.kicker{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.muted{color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);transition:.15s}
.opt:hover,.opt:focus-visible{border-color:var(--accent);background:rgba(60,240,138,.08);transform:translateY(-1px)}
.opt b{display:block;font-size:16px}
.opt small{display:block;color:var(--muted);margin-top:3px;font-size:13px;line-height:1.4}
.opt.primary{background:var(--accent);color:#04120a;border-color:transparent}
.opt.primary small{color:#0b3a20}
.opt.primary:hover{background:#5ff7a2}
.opt.ghost{background:transparent}
.opt.star{border-color:rgba(246,201,69,.6)}
.opt.feature{border-color:rgba(60,240,138,.55);background:rgba(60,240,138,.08)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .v{font-family:'Bebas Neue';font-size:30px;line-height:1}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat.gold .v{color:var(--gold)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px}
.pick .opt{padding:18px}
.num{font-family:'Bebas Neue';font-size:52px;line-height:1;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:var(--panel2);color:inherit;font-family:inherit}
.chip.on{background:var(--accent);color:#04120a;border-color:transparent;font-weight:700}
button.chip{cursor:pointer}
.chip.gold{border-color:rgba(246,201,69,.5);background:rgba(246,201,69,.1)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:32px;height:32px;border-radius:9px;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw button.on{outline:3px solid var(--accent);outline-offset:2px}
.log{font-size:14px;line-height:1.7;color:#cfe0d5;margin:0;padding-left:18px}
.score{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0;font-family:'Bebas Neue';font-size:clamp(26px,6vw,44px);text-align:center;flex-wrap:wrap}
.score b{font-size:1.4em;color:var(--gold);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}
tr.me td{color:var(--accent);font-weight:700}
.tablewrap{overflow-x:auto}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c1a13;color:var(--text);font:inherit}
input:disabled,select:disabled{opacity:.5}
label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px}
.celebrate{text-align:center}
.celebrate .cup{font-size:90px;line-height:1;animation:bounce 1s ease infinite alternate}
@keyframes bounce{to{transform:translateY(-10px) scale(1.05)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none}
.htop{position:absolute;top:12px;left:14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:calc(100% - 100px)}
/* Marcador de televisión */
.sb{display:flex;align-items:stretch;background:linear-gradient(180deg,#1b2433,#0c121c);border-radius:4px;overflow:hidden;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.14)}
.sb .cp{background:linear-gradient(180deg,#f6c945,#c99a1b);color:#121212;font-size:10px;letter-spacing:1px;padding:0 8px;display:flex;align-items:center;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.sb .tm{display:flex;align-items:center;gap:6px;padding:5px 10px;letter-spacing:1px}
.sb .tm i{display:block;width:5px;height:20px;border-radius:2px}
.sb .sc{background:#f4f6f8;color:#0b0f16;font-family:'Bebas Neue';font-size:25px;padding:0 10px;font-weight:400;display:flex;align-items:center;letter-spacing:2px}
.sb .clk{background:#05070b;color:#fff;font-variant-numeric:tabular-nums;padding:0 10px;display:flex;align-items:center;font-size:14px}
.meta{font-size:11px;color:#d7e6dc;background:rgba(5,12,9,.75);padding:3px 10px;border-radius:3px;text-align:left;letter-spacing:.5px}
.timer{position:absolute;top:12px;right:16px;font-family:'Bebas Neue';font-size:44px;color:#fff;text-shadow:0 2px 10px #000}
.timer.low{color:var(--red)}
.msg{position:absolute;top:26%;left:0;right:0;text-align:center;font-family:'Bebas Neue';font-size:clamp(54px,12vw,130px);color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.8);opacity:0;transform:scale(.8);transition:.25s;pointer-events:none;line-height:.95}
.msg.show{opacity:1;transform:scale(1)}
.msg.good{color:var(--gold)}
.msg.bad{color:#ffdcdc}
.msg small{display:block;font-family:Inter;font-size:18px;font-weight:800;letter-spacing:1px;color:#fff;margin-top:8px}
.decision{position:absolute;left:50%;bottom:78px;max-height:calc(100% - 170px);overflow-y:auto;transform:translateX(-50%);width:min(580px,calc(100% - 32px));pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;animation:pop .25s ease}
.decision .opts{grid-template-columns:1fr 1fr}
@media (max-width:520px){.decision .opts{grid-template-columns:1fr}.decision{bottom:120px}}
.hb{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:#e8f3ec;background:rgba(5,12,9,.78);padding:8px 12px;border-radius:10px;max-width:440px;line-height:1.45}
.pw{width:min(300px,70vw);background:rgba(5,12,9,.78);padding:8px 10px;border-radius:10px}
.pw .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:flex;justify-content:space-between}
.bar{position:relative;height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid var(--line)}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(60,240,138,.4)}
.bar .over{position:absolute;top:0;bottom:0;right:0;background:rgba(255,93,93,.35)}
.bar .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:linear-gradient(90deg,rgba(255,255,255,.6),var(--gold))}
.spin{margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);pointer-events:auto}
.spin button{all:unset;cursor:pointer;padding:2px 10px;border-radius:8px;border:1px solid var(--line);color:#fff}
.hbtns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}
.hbtn{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:9px 12px;border-radius:10px;background:rgba(5,12,9,.88);border:1px solid var(--line);color:#fff}
.hbtn:hover{border-color:var(--accent)}
.mlabel{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:rgba(5,12,9,.85);border:1px solid var(--blue);color:#fff;white-space:nowrap}
.mlabel.hot{border-color:var(--accent);background:var(--accent);color:#04120a}
/* Nombres y dorsales sobre los jugadores */
.ptag{position:absolute;transform:translate(-50%,-100%);font-size:10px;font-weight:800;line-height:1;padding:2px 5px 2px 3px;border-radius:3px;background:rgba(6,10,16,.72);color:#fff;white-space:nowrap;border-left:4px solid #fff;letter-spacing:.4px;pointer-events:none}
.ptag b{display:inline-block;min-width:15px;text-align:center;margin-right:3px;font-family:'Bebas Neue';font-size:13px;font-weight:400;vertical-align:-1px}
.ptag.me{font-size:12px;background:rgba(246,201,69,.95);color:#111;border-left-color:#111;padding:3px 7px 3px 4px}
.ptag.me b{font-size:15px}
.ptag em{font-style:normal;color:var(--accent);margin-left:4px}
.ptag.star{border-left-color:var(--gold)!important;background:rgba(40,30,0,.85);font-size:11px}
.flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(246,201,69,.35),transparent 70%);opacity:0;pointer-events:none;transition:opacity .5s}
.flash.on{opacity:1;transition:none}
.skip{position:absolute;right:16px;top:64px;pointer-events:auto}
/* Clasificación */
table.lt{font-size:12.5px}
table.lt td,table.lt th{padding:4px 6px}
table.lt td.n{font-variant-numeric:tabular-nums;text-align:center}
table.lt th.n{text-align:center}
table.lt td.tm{max-width:170px;overflow:hidden;text-overflow:ellipsis}
table.lt tr td:first-child{border-left:3px solid transparent;text-align:center;color:var(--muted)}
table.lt tr.z1 td:first-child{border-left-color:#3b82f6}
table.lt tr.z2 td:first-child{border-left-color:#f59e0b}
table.lt tr.z3 td:first-child{border-left-color:#14b8a6}
table.lt tr.zr td:first-child{border-left-color:var(--red)}
table.lt tr.me td{background:rgba(60,240,138,.1)}
table.lt tr.opp td{background:rgba(88,180,255,.1)}
table.lt td.pts{font-weight:800;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.form{display:inline-flex;gap:2px}.form span{width:16px;height:16px;border-radius:3px;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:#04120a}
.form .V{background:var(--accent)}.form .E{background:#9aa5b1}.form .D{background:var(--red);color:#fff}
.scroll{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
/* Previa de partido estilo TV */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:12px 0;text-align:center}
.badge{width:62px;height:62px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:24px;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.vs .tn{font-weight:800;font-size:15px}.vs .to{font-size:12px;color:var(--muted)}
.vs .x{font-family:'Bebas Neue';font-size:34px;color:var(--gold)}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.lineups{grid-template-columns:1fr}}
.minip{position:relative;aspect-ratio:68/80;border-radius:10px;background:repeating-linear-gradient(180deg,#2c8a3b 0 10%,#33963f 10% 20%);border:2px solid rgba(255,255,255,.55);overflow:hidden}
.minip:before{content:'';position:absolute;left:22%;right:22%;bottom:0;height:16%;border:2px solid rgba(255,255,255,.5);border-bottom:0}
.minip:after{content:'';position:absolute;left:-2px;right:-2px;top:0;border-top:2px solid rgba(255,255,255,.5);height:0}
.dot{position:absolute;transform:translate(-50%,-50%);text-align:center;width:72px}
.dot b{display:flex;margin:0 auto;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:16px;font-weight:400;border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.dot span{display:block;font-size:9.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot.me b{outline:3px solid var(--gold);outline-offset:1px}.dot.me span{color:var(--gold)}
.dot.star b{outline:2px dashed #fff;outline-offset:1px}
.lh{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px}
/* Ficha de jugador */
.pcard{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,#1a2c22,#0b1611 60%,#22301a);border:1px solid rgba(246,201,69,.45);margin:12px 0}
.pcard .ov{text-align:center;min-width:64px}
.pcard .ov .o{font-family:'Bebas Neue';font-size:56px;line-height:.9;color:var(--gold)}
.pcard .ov .p{font-weight:800;font-size:13px;letter-spacing:1px}
.pcard .ov .f{font-size:24px}
.pcard .nm{flex:1;min-width:0}
.pcard .nm b{display:block;font-family:'Bebas Neue';font-size:26px;letter-spacing:.5px;line-height:1}
.pcard .nm small{color:var(--muted);font-size:12px}
.pcard .bars{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;font-size:11px;margin-top:6px;align-items:center}
.pcard .bars i{height:5px;border-radius:3px;background:rgba(255,255,255,.12);display:block;overflow:hidden}.pcard .bars i em{display:block;height:100%;background:var(--accent)}
.pcard svg{flex:none}
@media (max-width:480px){.pcard svg{width:118px;height:118px}.pcard .bars{display:none}}
/* Balón de Oro */
.gala{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin-top:10px}
.nom{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:13px;opacity:0;animation:rise .45s ease forwards}
.nom .r{font-family:'Bebas Neue';font-size:22px;width:28px;text-align:center;color:var(--muted)}
.nom small{display:block;color:var(--muted);font-size:11px}
.nom.me{border-color:var(--gold);background:rgba(246,201,69,.12)}
.nom.p1{border-color:var(--gold);background:linear-gradient(90deg,rgba(246,201,69,.35),rgba(246,201,69,.05))}.nom.p1 .r{color:var(--gold)}
.nom.p2 .r{color:#d8dee6}.nom.p3 .r{color:#cd8a4a}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* Ceremonias 3D */
#ui.cer{background:linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(0,0,0,.7));align-items:flex-end;padding-bottom:18px}
#ui.cer .card{background:transparent;border:0;box-shadow:none;text-align:center;max-width:900px;margin:auto auto 0}
.cerT{font-family:'Bebas Neue';font-size:clamp(40px,8vw,92px);line-height:.9;color:var(--gold);text-shadow:0 4px 30px rgba(0,0,0,.9),0 0 40px rgba(246,201,69,.5);animation:zoomIn .8s cubic-bezier(.2,1.6,.4,1)}
.cerT.silver{color:#eef3f8;text-shadow:0 4px 30px rgba(0,0,0,.9),0 0 40px rgba(160,200,255,.6)}
.cerS{font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#fff;text-shadow:0 2px 10px #000;font-size:clamp(13px,2.4vw,18px)}
@keyframes zoomIn{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#ui.cer .opts{max-width:360px;margin:16px auto 0}
/* Retrato cinematográfico 16:9 */
.lbox{position:fixed;left:0;right:0;background:#000;pointer-events:none;z-index:2}
#ui.cine{background:none;padding:0;align-items:flex-end;pointer-events:none}
#ui.cine .card{pointer-events:auto;background:transparent;border:0;box-shadow:none;max-width:none;margin:0;padding:0 clamp(16px,3vw,40px) 0;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;width:100%;z-index:3;position:relative}
.cineT{font-family:'Bebas Neue';font-size:clamp(34px,6vw,72px);line-height:.9;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.9)}
.cineT small{display:block;font-family:Inter;font-size:13px;font-weight:800;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.cineB{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:600px){.hint{font-size:12px}.timer{font-size:32px}.sb{font-size:12px}.sb span{padding:6px 8px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash" class="flash"></div>
<div id="hud" class="hidden">
  <div class="htop">
    <div class="sb"><span class="cp" id="hComp"></span><span class="tm"><i id="hUsC"></i><span id="hUs"></span></span><span class="sc" id="hScore">0-0</span><span class="tm"><span id="hThem"></span><i id="hThemC"></i></span><span class="clk" id="hClock"></span></div>
    <div class="meta" id="hMeta"></div>
  </div>
  <div class="timer" id="hTimer"></div>
  <button class="hbtn skip hidden" id="bSkip">Saltar ▶▶</button>
  <div class="msg" id="hMsg"></div>
  <div id="tags"></div>
  <div id="labels"></div>
  <div class="decision hidden" id="hDecision"></div>
  <div class="hb" id="hBottom">
    <div class="hint" id="hHint"></div>
    <div class="pw" id="hPw">
      <div class="lbl"><span id="hPwLbl">Potencia</span><span id="hPwVal"></span></div>
      <div class="bar"><div class="zone" id="hZone"></div><div class="over" id="hOver"></div><div class="fill" id="hFill"></div></div>
      <div class="spin" id="hSpinRow"><button id="bSpinL" aria-label="Efecto izquierda">◀</button><span id="hSpin">Efecto: recto</span><button id="bSpinR" aria-label="Efecto derecha">▶</button></div>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="bCam"></button>
      <button class="hbtn" id="bSim">⏩ Simular</button>
      <button class="hbtn" id="bMute">🔊</button>
    </div>
  </div>
</div>
<div id="ui"></div>

<!--@THREE@-->
<script>
'use strict';
/* =========================================================
   UTILIDADES
   ========================================================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sig = x => 1 / (1 + Math.exp(-x));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }

async function playMatch(m) {
  const C = S.cur;
  if (m.interactive) {
    m.usXI = lineupFor(m.us.name, m.national, true); m.themXI = lineupFor(m.them.name, m.national, false);
    if ((await prematch(m)) === 'sim') m.interactive = false;
  }
  let gf, ga, tries = 0;
  // si juegas el momento decisivo, ese momento es una de las ocasiones del equipo: el resto del ataque pesa menos
  const L1 = m.league ? lgLam(m.us.s, m.them.s, m.home) : lam(m.us.s, m.them.s), L2 = m.league ? lgLam(m.them.s, m.us.s, !m.home) : lam(m.them.s, m.us.s);
  const lu = m.interactive ? Math.max(0.2, L1 - 0.45) : L1;
  do { gf = poisson(lu); ga = poisson(L2); tries++; } while (m.interactive && Math.abs(gf - ga) > 3 && tries < 30);
  const sh = shares(); let g = 0, a = 0;
  // en los partidos interactivos tu momento decisivo es una de esas ocasiones, así que el resto pesa menos
  const sm = m.interactive ? 0.8 : 1;
  for (let i = 0; i < gf; i++) { const r = Math.random(); if (r < sh.g * sm) g++; else if (r < (sh.g + sh.a) * sm) a++; }
  let mom = null, pens = false;
  if (m.interactive) {
    const minute = m.big ? randi(78, 90) : randi(60, 89);
    mom = await runMoment(buildSpec(m, gf, ga, minute));
    S.tot.mom++;
    if (mom.team) gf++;
    if (mom.me === 'goal') { g++; S.tot.momG++; } else if (mom.me === 'assist') { a++; S.tot.momA++; }
    if (mom.ceded) C.bonus += 0.4;
  }
  let win = gf > ga, draw = gf === ga;
  if (m.knockout && draw) {
    if (m.interactive) { const pr = await runMoment(buildSpec(m, gf, ga, 120, 'tanda')); win = Math.random() < (pr.team ? 0.64 : 0.3); }
    else win = Math.random() < sig((m.us.s - m.them.s) / 8);
    pens = true; draw = false;
  }

  if (m.comp === 'Mundial') { S.wc.apps++; S.wc.g += g; S.wc.a += a; }
  if (m.final) C.finalG += g;

  const scorers = [];
  const starGoals = (xi, goals, mine) => { const st = (xi || []).filter(p => p.star); for (let i = 0; i < goals; i++) if (st.length && Math.random() < 0.42) { const p = pick(st.filter(x => ['DC', 'ED', 'EI', 'MCO'].includes(x.pos)).concat(st)); scorers.push({ n: p.full || p.name, bdo: p.bdo, mine }); } };

  const sc = scorers.filter(x => !x.mine && x.bdo).map(x => ` · ⚽ ${x.n} (🟡 Balón de Oro)`).join('');
  C.log.push(`${m.comp}${m.stage ? ' (' + m.stage + ')' : ''}: ${m.us.name} ${gf}-${ga} ${m.them.name}${pens ? (win ? ' · gana en penaltis' : ' · pierde en penaltis') : ''}${contrib}${sc}`);

  return res;
}

  const col = r.win ? 'var(--accent)' : r.draw ? 'var(--gold)' : 'var(--red)';

  }

        const pre = `<h3>Clasificación${label ? ' · ' + label : ''} · antes de la jornada ${j + 1} de ${J}</h3>${o.legend}${tableHTML(so, { me: S.club, opp: o.opp, zones: o.zones, rel })}

function progress() {

  else if (S.age <= 29) d = rand(-0.5, 1); else if (S.age <= 32) d = -rand(0.5, 1.8); else d = -rand(1.5, 3.2);

   la edad media de debut en las grandes ligas es de 21,7 años. Por eso, desde Sudamérica, México, EE. UU. o

async function offers() {

  const all = Object.keys(CLUB).filter(n => n !== S.club).map(n => [n, clubS(n), CLUB[n].lg]);
  let cands = S.age >= 33
    ? all.filter(c => ['KSA', 'USA', 'MEX', 'ARG', 'BRA'].includes(c[2]) || c[1] <= S.ovr - 2)
    : all.filter(c => c[1] >= Math.min(S.ovr - 6, cur + 1) && c[1] <= S.ovr + 5 + S.fame / 25 + (S.age <= 21 ? Math.max(0, S.pot - S.ovr) * 0.55 : 0));
  const n = S.fame > 50 ? 3 : randi(1, 3), list = [];
  const wts = cands.map(c => offerWeight(c, ctx) * rand(0.7, 1.3));
  for (let i = 0; i < n && cands.length; i++) {
    let r = Math.random() * wts.reduce((a, b) => a + b, 0), k = 0;
    for (; k < cands.length - 1; k++) { if ((r -= wts[k]) <= 0) break; }
    if (wts[k] < 0.08 && Math.random() < 0.7) { cands.splice(k, 1); wts.splice(k, 1); i--; continue; }
    list.push(cands[k]); cands.splice(k, 1); wts.splice(k, 1);
  }
  const h = S.hist[y];
  if (h && h !== S.club && CLUB[h] && !list.some(c => c[0] === h)) list.unshift([h, clubS(h), CLUB[h].lg]);
  if (S.mode === 'wc' && Math.random() < 0.35) list.splice(1);

  const note = S.age <= 21 && S.pot >= 88 && list.some(c => c[1] >= 84) ? `<p class="muted" style="font-size:13px">📊 Con ${S.age} años y potencial ${S.pot}, los gigantes te ven como una inversión: pagan por lo que serás, no por lo que eres.</p>`

    : ctx.inEU && STEP_LG.includes(lg) && S.age <= 24 && S.ovr >= 76 ? `<p class="muted" style="font-size:13px">📊 Estás en una liga trampolín: es el momento en que los grandes de Inglaterra, España, Italia y Alemania se fijan en ti.</p>` : '';
  const opts = [{ label: `Quedarme en ${S.club}`, sub: `${LEAGUES[lg].t} · fuerza ${cur}`, value: null }]
    .concat(list.map(c => ({ label: `${c[0] === h ? '⭐ ' : ''}Fichar por ${c[0]}`, sub: `${LEAGUES[c[2]].t} · fuerza ${c[1]} · rol: ${S.ovr >= c[1] - 4 ? 'titular' : 'rotación'}${STEP_LG.includes(c[2]) && !ctx.inEU ? ' · liga escaparate' : ''}${c[0] === h ? ' · el camino de la historia real' : ''}`, value: c[0], cls: c[0] === h ? 'star' : '' })));
  const v = await ask(`<div class="kicker">Mercado de fichajes · verano ${y}</div><h2>Tienes ofertas</h2>
    <p>${S.progressNote}. Prestigio ${S.fame}. ¿Dónde jugarás la temporada ${seasonLabel()}?</p>${note}`, opts);
  if (v) {

    screen(`<div class="kicker">Oficial</div><h2>¡${esc(S.name)} ficha por ${esc(v)}!</h2><p>Nueva liga: ${LEAGUES[clubLg(v)].t}. Así luce tu nueva camiseta.</p><div class="opts"><button class="opt primary" id="ok"><b>Continuar</b></button></div>`, true);

}

    $('#go').onclick = () => { sfx.init(); sfx.click(); res('go'); };

async function careerLoop() {
  while (true) {
    save();
    const act = await hub();
    if (act === 'menu') return mainMenu();
    if (act === 'retire') return careerEnd();
    if (act === 'photo') { await portrait(); continue; }
    S.cur = { apps: 0, g: 0, a: 0, ncaps: 0, ng: 0, na: 0, titles: [], log: [], finalG: 0, lg: 0, bonus: S.nextBonus || 0, inj: 0, extra: 0 };
    S.nextBonus = 0;
    await seasonEvents();
    await clubSeason();
    await summer();
    await seasonEnd();
    if (S.age >= 41) return careerEnd();
    await offers();
  }
}

// Temporada actual (octubre de 2026 → 2026/27) y medias iniciales según la edad y el talento
const CUR_YEAR = 2026;
function startRatings(tal, pos, age) {
  const base = { DEL: [66, 58], EXT: [63, 62], MC: [58, 66] }[pos], o17 = tal === 95 ? 65 : tal === 90 ? 64 : 62;
  let o = o17 - Math.max(0, 17 - age) * 3;
  for (let a = 17; a < age; a++) { const gap = tal - o; o += a <= 20 ? 1.5 + gap * 0.14 : a <= 23 ? 1 + gap * 0.15 : a <= 27 ? gap * 0.2 + 0.3 : a <= 29 ? 0.25 : a <= 32 ? -1.15 : -2.3; }
  o = Math.round(clamp(o, 45, tal)); const d = o - o17;
  return { ovr: o, pot: Math.max(tal, o), tiro: Math.round(base[0] + d * 0.9), pase: Math.round(base[1] + d * 0.9), temple: Math.round(clamp(55 + (age - 17) * 1.4, 50, 85)), fame: Math.round(clamp(8 + Math.max(0, o - 70) * 1.6 + Math.max(0, age - 20) * 0.6, 5, 70)) };
}

    <p>Cada temporada: una decisión fuera del campo, los <b>partidos clave de liga</b>, las eliminatorias y <b>finales</b> y los <b>torneos de selecciones</b>. En el mercado de fichajes, ⭐ marca el camino de la historia real.</p>
    ${loadSave() ? '<p style="color:var(--gold)">⚠️ Empezar una nueva carrera reemplazará tu partida guardada.</p>' : ''}
    <div class="opts"><button class="opt primary" id="lGo"><b>¡Empezar!</b></button><button class="opt" id="lBack"><b>Volver</b></button></div>`, true);
  setPreview(tpl.look, kitFor(tpl.club), tpl.num);
  $('#lBack').onclick = () => mainMenu();
  $('#lGo').onclick = () => { sfx.click(); newCareer(tpl, 'carrera'); S.legend = p; careerLoop(); };
});

if (!DBG) mainMenu();
</script>
</body>
</html>
